version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Mexico_City
    open-pull-requests-limit: 10
    versioning-strategy: increase
    labels:
      - dependencies
      - security
    commit-message:
      prefix: chore
      include: scope
    groups:
      angular:
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
      linting-and-types:
        patterns:
          - "@typescript-eslint/*"
          - "typescript"
          - "typescript-eslint"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Mexico_City
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
